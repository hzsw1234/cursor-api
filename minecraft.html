// PARTICLE SYSTEM
// ============================================================
class ParticleSystem {
    constructor(scene) {
        this.scene = scene;
        this.particles = [];
    }

    spawnBreakParticles(x, y, z, blockType) {
        const colors = {
            [BlockType.GRASS]: [0x5D9B47, 0x4D8B37],
            [BlockType.DIRT]: [0x8B6B3F, 0x7A5930],
            [BlockType.STONE]: [0x888888, 0x999999],
            [BlockType.SAND]: [0xD4C090, 0xE0D0A0],
            [BlockType.OAK_LOG]: [0x6B4B30, 0x8B6B50],
            [BlockType.OAK_LEAVES]: [0x3B7B2B, 0x5B9B4B],
            [BlockType.COBBLESTONE]: [0x777777, 0x999999],
        };
        const cols = colors[blockType] || [0x888888, 0x999999];

        for (let i = 0; i < 12; i++) {
            const geo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const mat = new THREE.MeshLambertMaterial({ color: cols[i % cols.length] });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(
                x + 0.2 + Math.random() * 0.6,
                y + 0.2 + Math.random() * 0.6,
                z + 0.2 + Math.random() * 0.6
            );
            this.scene.add(mesh);
            this.particles.push({
                mesh,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 3,
                    Math.random() * 4 + 1,
                    (Math.random() - 0.5) * 3
                ),
                life: 0.8 + Math.random() * 0.5
            });
        }
    }

    update(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.velocity.y -= 15 * dt;
            p.mesh.position.add(p.velocity.clone().multiplyScalar(dt));
            p.mesh.rotation.x += dt * 5;
            p.mesh.rotation.z += dt * 3;
            p.life -= dt;
            p.mesh.material.opacity = Math.max(0, p.life * 2);
            if (p.life <= 0) {
                this.scene.remove(p.mesh);
                p.mesh.geometry.dispose();
                p.mesh.material.dispose();
                this.particles.splice(i, 1);
            }
        }
    }
}

// ============================================================
// SOUND MANAGER
// ============================================================
class SoundManager {
    constructor() {
        this.ctx = null;
        this.enabled = true;
        this.initialized = false;
    }

    init() {
        try {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            this.initialized = true;
        } catch(e) {
            this.enabled = false;
        }
    }

    playTone(freq, duration, type, volume) {
        if (!this.enabled || !this.initialized) return;
        try {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.frequency.value = freq;
            osc.type = type || 'square';
            gain.gain.value = volume || 0.05;
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.start();
            osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
    }

    playBreak() { this.playTone(150 + Math.random()*100, 0.1, 'square', 0.04); }
    playPlace() { this.playTone(400 + Math.random()*100, 0.08, 'square', 0.03); }
    playHit() { this.playTone(200, 0.15, 'sawtooth', 0.04); }
    playStep() { this.playTone(80 + Math.random()*40, 0.05, 'triangle', 0.02); }
    playDamage() { this.playTone(300, 0.2, 'sawtooth', 0.06); }
    playExplosion() {
        if (!this.enabled || !this.initialized) return;
        try {
            const bufferSize = this.ctx.sampleRate * 0.5;
            const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
                data[i] = (Math.random() * 2 - 1) * (1 - i/bufferSize);
            }
            const source = this.ctx.createBufferSource();
            source.buffer = buffer;
            const gain = this.ctx.createGain();
            gain.gain.value = 0.15;
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.5);
            source.connect(gain);
            gain.connect(this.ctx.destination);
            source.start();
        } catch(e) {}
    }
}

// ============================================================
// UI MANAGER
// ============================================================
class UIManager {
    constructor(player, atlas) {
        this.player = player;
        this.atlas = atlas;
        this.debugVisible = false;
        this.inventoryOpen = false;
        this.setupHotbar();
        this.setupHealthBar();
        this.setupHungerBar();
        this.blockPreviewCanvases = {};
    }

    getBlockPreview(blockType) {
        if (this.blockPreviewCanvases[blockType]) return this.blockPreviewCanvases[blockType];
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        const ctx = canvas.getContext('2d');
        const texInfo = this.atlas.blockTextures[blockType];
        if (!texInfo) return canvas;
        const texIdx = texInfo.top;
        const col = texIdx % this.atlas.tilesPerRow;
        const row = Math.floor(texIdx / this.atlas.tilesPerRow);
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(
            this.atlas.canvas,
            col * 16, row * 16, 16, 16,
            0, 0, 32, 32
        );
        this.blockPreviewCanvases[blockType] = canvas;
        return canvas;
    }

    setupHotbar() {
        const container = document.getElementById('hotbar-slots');
        container.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const slot = document.createElement('div');
            slot.className = 'hotbar-slot' + (i === 0 ? ' selected' : '');
            slot.id = `hotbar-${i}`;
            container.appendChild(slot);
        }
    }

    setupHealthBar() {
        const bar = document.getElementById('health-bar');
        bar.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const heart = document.createElement('span');
            heart.className = 'heart';
            heart.id = `heart-${i}`;
            heart.textContent = '❤';
            heart.style.color = '#ff0000';
            heart.style.fontSize = '12px';
            heart.style.textShadow = '1px 1px 0 #550000';
            bar.appendChild(heart);
        }
    }

    setupHungerBar() {
        const bar = document.getElementById('hunger-bar');
        bar.innerHTML = '';
        for (let i = 0; i < 10; i++) {
            const hunger = document.createElement('span');
            hunger.className = 'hunger';
            hunger.id = `hunger-${i}`;
            hunger.textContent = '🍗';
            hunger.style.fontSize = '11px';
            bar.appendChild(hunger);
        }
    }

    update(world, dayNight, fps) {
        for (let i = 0; i < 9; i++) {
            const slot = document.getElementById(`hotbar-${i}`);
            slot.className = 'hotbar-slot' + (i === this.player.selectedSlot ? ' selected' : '');
            slot.innerHTML = '';
            const item = this.player.inventory[i];
            if (item) {
                const preview = this.getBlockPreview(item.type);
                const canvas = preview.cloneNode(true);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(preview, 0, 0);
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = item.count;
                    slot.appendChild(count);
                }
            }
        }

        for (let i = 0; i < 10; i++) {
            const heart = document.getElementById(`heart-${i}`);
            const hp = this.player.health / 2;
            if (i < Math.floor(hp)) {
                heart.style.color = '#ff0000';
                heart.textContent = '❤';
            } else if (i < hp) {
                heart.style.color = '#ff6666';
                heart.textContent = '❤';
            } else {
                heart.style.color = '#333';
                heart.textContent = '❤';
            }
        }

        for (let i = 0; i < 10; i++) {
            const hunger = document.getElementById(`hunger-${i}`);
            const h = this.player.hunger / 2;
            hunger.style.opacity = i < h ? '1' : '0.3';
        }

        document.getElementById('xp-bar').style.width = `${(this.player.xp % 100)}%`;

        const selected = this.player.getSelectedBlock();
        const nameEl = document.getElementById('selected-block');
        nameEl.textContent = selected !== BlockType.AIR ? (BlockNames[selected] || 'Unknown') : '';

        if (this.debugVisible) {
            const p = this.player.position;
            const cx = Math.floor(p.x / CHUNK_SIZE);
            const cz = Math.floor(p.z / CHUNK_SIZE);
            const biome = world.getBiome(Math.floor(p.x), Math.floor(p.z));
            const biomeNames = ['Plains','Forest','Desert','Mountains','Snow','Birch Forest','Taiga'];
            document.getElementById('debug-info').innerHTML =
                `FPS: ${fps}<br>` +
                `XYZ: ${p.x.toFixed(1)} / ${p.y.toFixed(1)} / ${p.z.toFixed(1)}<br>` +
                `Chunk: ${cx}, ${cz}<br>` +
                `Biome: ${biomeNames[biome] || 'Unknown'}<br>` +
                `Chunks loaded: ${world.chunks.size}<br>` +
                `Time: ${dayNight.getTimeString()}<br>` +
                `Mobs: ${game.mobManager.mobs.length}<br>` +
                `${this.player.flying ? 'FLYING' : ''}` +
                `${this.player.inWater ? ' SWIMMING' : ''}`;
        }
    }

    showHUD() {
        ['crosshair','hotbar','health-bar','hunger-bar','xp-bar-container','selected-block'].forEach(id => {
            document.getElementById(id).style.display = id === 'crosshair' || id === 'selected-block' ? 'block' : 'flex';
        });
        document.getElementById('xp-bar-container').style.display = 'block';
    }

    hideHUD() {
        ['crosshair','hotbar','health-bar','hunger-bar','xp-bar-container','selected-block','debug-info'].forEach(id => {
            document.getElementById(id).style.display = 'none';
        });
    }

    toggleDebug() {
        this.debugVisible = !this.debugVisible;
        document.getElementById('debug-info').style.display = this.debugVisible ? 'block' : 'none';
    }

    openInventory() {
        this.inventoryOpen = true;
        document.getElementById('inventory-screen').style.display = 'flex';
        this.updateInventoryUI();
    }

    closeInventory() {
        this.inventoryOpen = false;
        document.getElementById('inventory-screen').style.display = 'none';
    }

    updateInventoryUI() {
        const mainGrid = document.getElementById('inv-main');
        const hotbarGrid = document.getElementById('inv-hotbar');
        mainGrid.innerHTML = '';
        hotbarGrid.innerHTML = '';

        for (let i = 9; i < 36; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slot.dataset.index = i;
            const item = this.player.inventory[i];
            if (item) {
                const preview = this.getBlockPreview(item.type);
                const canvas = preview.cloneNode(true);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(preview, 0, 0);
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = item.count;
                    slot.appendChild(count);
                }
            }
            slot.addEventListener('click', () => this.handleInventoryClick(i));
            mainGrid.appendChild(slot);
        }

        for (let i = 0; i < 9; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            slot.dataset.index = i;
            const item = this.player.inventory[i];
            if (item) {
                const preview = this.getBlockPreview(item.type);
                const canvas = preview.cloneNode(true);
                const ctx = canvas.getContext('2d');
                ctx.drawImage(preview, 0, 0);
                slot.appendChild(canvas);
                if (item.count > 1) {
                    const count = document.createElement('span');
                    count.className = 'count';
                    count.textContent = item.count;
                    slot.appendChild(count);
                }
            }
            slot.addEventListener('click', () => this.handleInventoryClick(i));
            hotbarGrid.appendChild(slot);
        }

        const craftingGrid = document.getElementById('crafting-grid');
        craftingGrid.innerHTML = '';
        for (let i = 0; i < 9; i++) {
            const slot = document.createElement('div');
            slot.className = 'inv-slot';
            craftingGrid.appendChild(slot);
        }
    }

    handleInventoryClick(slotIndex) {
        if (!this.cursorItem) {
            if (this.player.inventory[slotIndex]) {
                this.cursorItem = { ...this.player.inventory[slotIndex] };
                this.player.inventory[slotIndex] = null;
            }
        } else {
            if (!this.player.inventory[slotIndex]) {
                this.player.inventory[slotIndex] = { ...this.cursorItem };
                this.cursorItem = null;
            } else if (this.player.inventory[slotIndex].type === this.cursorItem.type) {
                this.player.inventory[slotIndex].count += this.cursorItem.count;
                this.cursorItem = null;
            } else {
                const temp = { ...this.player.inventory[slotIndex] };
                this.player.inventory[slotIndex] = { ...this.cursorItem };
                this.cursorItem = temp;
            }
        }
        this.updateInventoryUI();
    }
}

// ============================================================
// BLOCK HIGHLIGHT
// ============================================================
class BlockHighlight {
    constructor(scene) {
        const geo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
        const edges = new THREE.EdgesGeometry(geo);
        this.line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({
            color: 0x000000, linewidth: 2, transparent: true, opacity: 0.5
        }));
        this.line.visible = false;
        scene.add(this.line);

        const overlayGeo = new THREE.BoxGeometry(1.003, 1.003, 1.003);
        this.overlay = new THREE.Mesh(overlayGeo, new THREE.MeshBasicMaterial({
            color: 0xffffff, transparent: true, opacity: 0.1, depthTest: true
        }));
        this.overlay.visible = false;
        scene.add(this.overlay);
    }

    update(hit, breakProgress) {
        if (hit) {
            this.line.position.set(hit.x + 0.5, hit.y + 0.5, hit.z + 0.5);
            this.line.visible = true;
            this.overlay.position.copy(this.line.position);
            this.overlay.visible = true;
            this.overlay.material.opacity = 0.05 + breakProgress * 0.25;
        } else {
            this.line.visible = false;
            this.overlay.visible = false;
        }
    }
}

// ============================================================
// WEATHER SYSTEM
// ============================================================
class WeatherSystem {
    constructor(scene) {
        this.scene = scene;
        this.raining = false;
        this.rainTimer = 0;
        this.rainToggleTime = 120 + Math.random() * 300;
        this.rainParticles = null;
        this.rainPositions = null;
        this.rainVelocities = [];
        this.createRain();
    }

    createRain() {
        const count = 3000;
        const geometry = new THREE.BufferGeometry();
        this.rainPositions = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            this.rainPositions[i*3] = (Math.random() - 0.5) * 80;
            this.rainPositions[i*3+1] = Math.random() * 60;
            this.rainPositions[i*3+2] = (Math.random() - 0.5) * 80;
            this.rainVelocities.push(-12 - Math.random() * 8);
        }
        geometry.setAttribute('position', new THREE.BufferAttribute(this.rainPositions, 3));
        this.rainParticles = new THREE.Points(geometry, new THREE.PointsMaterial({
            color: 0x8899bb, size: 0.15, transparent: true, opacity: 0.5
        }));
        this.rainParticles.visible = false;
        this.scene.add(this.rainParticles);
    }

    update(dt, playerPos) {
        this.rainTimer += dt;
        if (this.rainTimer > this.rainToggleTime) {
            this.raining = !this.raining;
            this.rainTimer = 0;
            this.rainToggleTime = (this.raining ? 30 : 90) + Math.random() * 120;
        }

        this.rainParticles.visible = this.raining;
        if (!this.raining) return;

        this.rainParticles.position.set(playerPos.x, 0, playerPos.z);

        for (let i = 0; i < this.rainPositions.length / 3; i++) {
            this.rainPositions[i*3+1] += this.rainVelocities[i] * dt;
            if (this.rainPositions[i*3+1] < -5) {
                this.rainPositions[i*3+1] = 50 + Math.random() * 10;
                this.rainPositions[i*3] = (Math.random() - 0.5) * 80;
                this.rainPositions[i*3+2] = (Math.random() - 0.5) * 80;
            }
        }
        this.rainParticles.geometry.attributes.position.needsUpdate = true;
    }
}

// ============================================================
// CLOUDS
// ============================================================
class CloudSystem {
    constructor(scene) {
        this.scene = scene;
        this.clouds = new THREE.Group();
        this.createClouds();
        scene.add(this.clouds);
    }

    createClouds() {
        const cloudMat = new THREE.MeshBasicMaterial({
            color: 0xffffff, transparent: true, opacity: 0.7, fog: false
        });
        for (let i = 0; i < 40; i++) {
            const cloud = new THREE.Group();
            const numBlocks = 4 + Math.floor(Math.random() * 8);
            for (let j = 0; j < numBlocks; j++) {
                const geo = new THREE.BoxGeometry(
                    3 + Math.random() * 4,
                    1 + Math.random(),
                    3 + Math.random() * 4
                );
                const mesh = new THREE.Mesh(geo, cloudMat);
                mesh.position.set(
                    (Math.random()-0.5)*8,
                    (Math.random()-0.5)*1,
                    (Math.random()-0.5)*8
                );
                cloud.add(mesh);
            }
            cloud.position.set(
                (Math.random()-0.5)*300,
                80 + Math.random() * 20,
                (Math.random()-0.5)*300
            );
            cloud.userData.speed = 0.5 + Math.random() * 1;
            this.clouds.add(cloud);
        }
    }

    update(dt, playerPos) {
        this.clouds.children.forEach(cloud => {
            cloud.position.x += cloud.userData.speed * dt;
            if (cloud.position.x > playerPos.x + 200) {
                cloud.position.x = playerPos.x - 200;
                cloud.position.z = playerPos.z + (Math.random()-0.5)*300;
            }
        });
    }
}

// ============================================================
// MAIN GAME
// ============================================================
class Game {
    constructor() {
        this.running = false;
        this.paused = false;
        this.lastTime = 0;
        this.fps = 0;
        this.fpsFrames = 0;
        this.fpsTime = 0;
        this.stepTimer = 0;

        this.scene = new THREE.Scene();
        this.scene.background = new THREE.Color(0.45, 0.65, 1.0);
        this.scene.fog = new THREE.Fog(0x87AAFF, 10, RENDER_DISTANCE * CHUNK_SIZE * 0.8);

        this.camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 500);

        this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        this.renderer.outputEncoding = THREE.sRGBEncoding;
        document.body.appendChild(this.renderer.domElement);

        this.world = null;
        this.player = null;
        this.mobManager = null;
        this.dayNight = null;
        this.particleSystem = null;
        this.soundManager = new SoundManager();
        this.ui = null;
        this.highlight = null;
        this.weather = null;
        this.cloudSystem = null;

        this.setupEventListeners();
    }

    async init() {
        document.getElementById('loading-screen').style.display = 'flex';
        document.getElementById('blocker').style.display = 'none';

        await this.sleep(50);
        document.getElementById('loading-text').textContent = 'Creating world...';
        document.getElementById('loading-bar-inner').style.width = '10%';
        await this.sleep(50);

        this.world = new World(this.scene, Date.now());

        document.getElementById('loading-text').textContent = 'Generating terrain...';
        document.getElementById('loading-bar-inner').style.width = '30%';
        await this.sleep(50);

        let spawnX = 8, spawnZ = 8;
        for (let tries = 0; tries < 20; tries++) {
            const biome = this.world.getBiome(spawnX, spawnZ);
            if (biome === BiomeType.PLAINS || biome === BiomeType.DESERT) break;
            spawnX += 16; spawnZ += 8;
        }
        const spawnHeight = this.world.getTerrainHeight(spawnX, spawnZ) + 3;
        this.player = new Player(this.camera, this.world);
        this.player.position.set(spawnX, spawnHeight, spawnZ);

        document.getElementById('loading-text').textContent = 'Loading chunks...';
        document.getElementById('loading-bar-inner').style.width = '50%';
        await this.sleep(50);

        const pcx = Math.floor(spawnX / CHUNK_SIZE);
        const pcz = Math.floor(spawnZ / CHUNK_SIZE);
        for (let dx = -3; dx <= 3; dx++) {
            for (let dz = -3; dz <= 3; dz++) {
                this.world.ensureChunk(pcx + dx, pcz + dz);
            }
        }

        document.getElementById('loading-text').textContent = 'Building meshes...';
        document.getElementById('loading-bar-inner').style.width = '70%';
        await this.sleep(50);

        for (const chunk of this.world.chunks.values()) {
            if (chunk.dirty) chunk.buildMesh(this.world.atlas);
        }

        document.getElementById('loading-text').textContent = 'Initializing systems...';
        document.getElementById('loading-bar-inner').style.width = '85%';
        await this.sleep(50);

        this.dayNight = new DayNightCycle(this.scene);
        this.mobManager = new MobManager(this.world, this.scene);
        this.particleSystem = new ParticleSystem(this.scene);
        this.soundManager.init();
        this.highlight = new BlockHighlight(this.scene);
        this.weather = new WeatherSystem(this.scene);
        this.cloudSystem = new CloudSystem(this.scene);
        this.ui = new UIManager(this.player, this.world.atlas);

        document.getElementById('loading-bar-inner').style.width = '100%';
        document.getElementById('loading-text').textContent = 'Done!';
        await this.sleep(300);

        document.getElementById('loading-screen').style.display = 'none';
        this.running = true;
        this.ui.showHUD();
        this.lockPointer();
        this.lastTime = performance.now();
        this.loop();
    }

    sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    lockPointer() {
        document.body.requestPointerLock();
    }

    setupEventListeners() {
        document.getElementById('play-btn').addEventListener('click', () => {
            this.init();
        });

        document.getElementById('controls-btn').addEventListener('click', () => {
            alert('Controls:\nWASD - Move\nSpace - Jump\nShift - Sprint\nLeft Click - Break block\nRight Click - Place block\n1-9 - Select hotbar slot\nScroll - Change slot\nE - Inventory\nF3 - Debug info\nF - Toggle fly mode\nESC - Pause');
        });

        document.getElementById('resume-btn').addEventListener('click', () => {
            this.paused = false;
            document.getElementById('pause-menu').style.display = 'none';
            this.lockPointer();
        });

        document.getElementById('quit-btn').addEventListener('click', () => {
            location.reload();
        });

        document.addEventListener('pointerlockchange', () => {
            if (!document.pointerLockElement && this.running && !this.ui?.inventoryOpen) {
                this.paused = true;
                document.getElementById('pause-menu').style.display = 'flex';
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement && !this.paused && this.player && !this.ui?.inventoryOpen) {
                this.player.handleMouseMove(e);
            }
        });

        document.addEventListener('mousedown', (e) => {
            if (!this.player) return;
            if (this.ui?.inventoryOpen) return;
            if (!document.pointerLockElement) return;
            this.player.mouseButtons[e.button] = true;
            if (e.button === 0) {
                this.handleAttack();
            }
        });

        document.addEventListener('mouseup', (e) => {
            if (!this.player) return;
            this.player.mouseButtons[e.button] = false;
            if (e.button === 0) {
                this.player.breakProgress = 0;
                this.player.breakTarget = null;
            }
        });

        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (document.pointerLockElement && !this.paused && !this.ui?.inventoryOpen) {
                this.handlePlace();
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!this.player) return;
            this.player.keys[e.code] = true;

            if (e.code === 'Escape') {
                if (this.ui.inventoryOpen) {
                    this.ui.closeInventory();
                    this.lockPointer();
                } else if (this.paused) {
                    this.paused = false;
                    document.getElementById('pause-menu').style.display = 'none';
                    this.lockPointer();
                }
            }

            if (e.code === 'KeyE' && document.pointerLockElement) {
                if (this.ui.inventoryOpen) {
                    this.ui.closeInventory();
                    this.lockPointer();
                } else {
                    document.exitPointerLock();
                    this.ui.openInventory();
                }
                e.preventDefault();
            }

            if (e.code === 'F3') { this.ui?.toggleDebug(); e.preventDefault(); }

            if (e.code === 'KeyF') {
                this.player.flying = !this.player.flying;
                this.player.velocity.y = 0;
            }

            if (e.code >= 'Digit1' && e.code <= 'Digit9') {
                this.player.selectedSlot = parseInt(e.code.charAt(5)) - 1;
            }

            if (e.code === 'Space') {
                const now = performance.now();
                if (now - this.player.lastSpacePress < 300) {
                    this.player.flying = !this.player.flying;
                    this.player.velocity.y = 0;
                }
                this.player.lastSpacePress = now;
            }
        });

        document.addEventListener('keyup', (e) => {
            if (this.player) this.player.keys[e.code] = false;
        });

        document.addEventListener('wheel', (e) => {
            if (!this.player || this.paused) return;
            if (e.deltaY > 0) {
                this.player.selectedSlot = (this.player.selectedSlot + 1) % 9;
            } else {
                this.player.selectedSlot = (this.player.selectedSlot + 8) % 9;
            }
        });

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });
    }

    handleAttack() {
        if (!this.player || this.paused) return;
        const origin = this.camera.position.clone();
        const dir = this.player.getLookDir();
        this.mobManager.hitMob(origin, dir, REACH_DISTANCE, 4);
    }

    handlePlace() {
        if (!this.player || this.paused) return;
        const origin = this.camera.position.clone();
        const dir = this.player.getLookDir();
        const hit = this.world.raycast(origin, dir, REACH_DISTANCE);
        if (!hit) return;

        const placeX = hit.x + Math.round(hit.face.x);
        const placeY = hit.y + Math.round(hit.face.y);
        const placeZ = hit.z + Math.round(hit.face.z);

        const px = Math.floor(this.player.position.x);
        const py = Math.floor(this.player.position.y);
        const pz = Math.floor(this.player.position.z);
        if ((placeX === px && placeZ === pz && (placeY === py || placeY === py + 1))) return;

        const blockType = this.player.getSelectedBlock();
        if (blockType === BlockType.AIR) return;
        if (this.world.getBlock(placeX, placeY, placeZ) !== BlockType.AIR &&
            this.world.getBlock(placeX, placeY, placeZ) !== BlockType.WATER) return;

        this.world.setBlock(placeX, placeY, placeZ, blockType);
        this.player.removeFromSlot(this.player.selectedSlot);
        this.soundManager.playPlace();
    }

    handleBreak(dt) {
        if (!this.player.mouseButtons[0] || this.paused || this.ui?.inventoryOpen) {
            this.player.breakProgress = 0;
            this.player.breakTarget = null;
            return;
        }

        const origin = this.camera.position.clone();
        const dir = this.player.getLookDir();
        const hit = this.world.raycast(origin, dir, REACH_DISTANCE);

        if (!hit) {
            this.player.breakProgress = 0;
            this.player.breakTarget = null;
            return;
        }

        const key = `${hit.x},${hit.y},${hit.z}`;
        if (this.player.breakTarget !== key) {
            this.player.breakTarget = key;
            this.player.breakProgress = 0;
        }

        let breakTime = BREAK_TIME;
        if (hit.block === BlockType.STONE || hit.block === BlockType.COBBLESTONE) breakTime = 0.8;
        else if (hit.block === BlockType.OBSIDIAN) breakTime = 4;
        else if (hit.block === BlockType.BEDROCK) breakTime = 999;
        else if (hit.block === BlockType.IRON_ORE || hit.block === BlockType.GOLD_ORE) breakTime = 1.0;
        else if (hit.block === BlockType.DIAMOND_ORE) breakTime = 1.5;

        this.player.breakProgress += dt / breakTime;

        if (this.player.breakProgress >= 1) {
            this.particleSystem.spawnBreakParticles(hit.x, hit.y, hit.z, hit.block);
            this.player.addToInventory(hit.block, 1);
            this.world.setBlock(hit.x, hit.y, hit.z, BlockType.AIR);
            this.soundManager.playBreak();
            this.player.breakProgress = 0;
            this.player.breakTarget = null;
            this.player.xp += 1;
        }
    }

    loop() {
        if (!this.running) return;
        requestAnimationFrame(() => this.loop());

        const now = performance.now();
        let dt = (now - this.lastTime) / 1000;
        this.lastTime = now;
        dt = Math.min(dt, 0.1);

        this.fpsFrames++;
        this.fpsTime += dt;
        if (this.fpsTime >= 1) {
            this.fps = Math.round(this.fpsFrames / this.fpsTime);
            this.fpsFrames = 0;
            this.fpsTime = 0;
        }

        if (this.paused || this.ui?.inventoryOpen) {
            this.renderer.render(this.scene, this.camera);
            return;
        }

        this.player.update(dt);
        this.handleBreak(dt);

        const origin = this.camera.position.clone();
        const dir = this.player.getLookDir();
        const hit = this.world.raycast(origin, dir, REACH_DISTANCE);
        this.highlight.update(hit, this.player.breakProgress);

        this.world.updateChunks(this.player.position.x, this.player.position.z);
        this.dayNight.update(dt, this.player.position);
        this.mobManager.update(dt, this.player.position, this.player, this.dayNight.isNight());
        this.particleSystem.update(dt);
        this.weather.update(dt, this.player.position);
        this.cloudSystem.update(dt, this.player.position);

        this.stepTimer += dt;
        if (this.player.onGround && this.stepTimer > 0.4 &&
            (this.player.keys['KeyW'] || this.player.keys['KeyS'] ||
             this.player.keys['KeyA'] || this.player.keys['KeyD'])) {
            this.soundManager.playStep();
            this.stepTimer = 0;
        }

        if (this.player.inWater) {
            this.scene.fog.near = 2;
            this.scene.fog.far = 15;
            this.scene.fog.color.set(0x1a3a6a);
        } else {
            this.scene.fog.near = 10;
            this.scene.fog.far = RENDER_DISTANCE * CHUNK_SIZE * 0.8;
        }

        this.ui.update(this.world, this.dayNight, this.fps);
        this.renderer.render(this.scene, this.camera);
    }
}

const game = new Game();
</script>
